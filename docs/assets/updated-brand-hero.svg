<svg width="1600" height="760" viewBox="0 0 1600 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">UPDATED by AGICY.Ai — evidence-first agent workspace</title>
  <desc id="desc">A dark editorial workspace visual showing sourced answers, web search evidence and connected agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101522"/>
      <stop offset="1" stop-color="#20283A"/>
    </linearGradient>
    <linearGradient id="glow" x1="190" y1="110" x2="1280" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9894A" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#8BB9A0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#101522" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#05070D" flood-opacity=".35"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#D8E0ED" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1600" height="760" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="760" rx="36" fill="url(#grid)"/>
  <ellipse cx="1060" cy="160" rx="520" ry="240" fill="#C9894A" fill-opacity=".12" filter="url(#soft)"/>
  <ellipse cx="360" cy="680" rx="440" ry="180" fill="#8BB9A0" fill-opacity=".1" filter="url(#soft)"/>
  <path d="M0 560C250 470 410 640 650 520C890 400 1110 490 1600 250V760H0V560Z" fill="url(#glow)"/>

  <g opacity=".58" stroke="#AFC6D9" stroke-width="2">
    <path d="M920 190L1170 110L1380 250L1260 430L1010 390L920 190Z"/>
    <path d="M920 190L1010 390M1170 110L1260 430M1380 250L1010 390"/>
  </g>
  <g fill="#C9894A">
    <circle cx="920" cy="190" r="6"/>
    <circle cx="1170" cy="110" r="6"/>
    <circle cx="1380" cy="250" r="6"/>
    <circle cx="1260" cy="430" r="6"/>
  </g>
  <circle cx="1010" cy="390" r="11" fill="#B9DFC8"/>
  <circle cx="1010" cy="390" r="21" stroke="#B9DFC8" stroke-opacity=".35" stroke-width="2"/>

  <g fill="#F4F0E8">
    <text x="96" y="104" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="5">AGICY.AI / DESKTOP INTELLIGENCE</text>
    <text x="96" y="238" font-family="Georgia, serif" font-size="106" font-weight="700" letter-spacing="-4">UPDATED</text>
    <text x="103" y="290" font-family="Arial, sans-serif" font-size="28" letter-spacing="1" fill="#C8D1DF">Ask naturally. Search the web. See the evidence.</text>
  </g>
  <rect x="100" y="334" width="300" height="2" fill="#C9894A"/>
  <text x="100" y="382" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#C9894A">EVIDENCE-FIRST AGENT WORKSPACE</text>
  <text x="100" y="423" font-family="Arial, sans-serif" font-size="18" fill="#AEB9CA">Voice, web search and connected tools</text>
  <text x="100" y="452" font-family="Arial, sans-serif" font-size="18" fill="#AEB9CA">in one calm, inspectable desktop surface.</text>

  <g filter="url(#shadow)">
    <rect x="650" y="420" width="770" height="236" rx="18" fill="#F4F0E8"/>
    <rect x="650" y="420" width="770" height="42" rx="18" fill="#EAE4DA"/>
    <circle cx="681" cy="441" r="6" fill="#C9894A"/>
    <circle cx="704" cy="441" r="6" fill="#B9DFC8"/>
    <circle cx="727" cy="441" r="6" fill="#AEB9CA"/>
    <text x="770" y="447" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#68758A">ASK UPDATED</text>
    <rect x="686" y="492" width="270" height="124" rx="12" fill="#E7EFE9"/>
    <text x="710" y="523" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#5F8F77">PRIMARY SOURCES</text>
    <text x="710" y="557" font-family="Georgia, serif" font-size="22" fill="#172034">Answer with receipts.</text>
    <text x="710" y="585" font-family="Arial, sans-serif" font-size="13" fill="#68758A">3 sources · verified 2 min ago</text>
    <rect x="989" y="492" width="392" height="52" rx="10" fill="#FFFFFF" stroke="#D9D2C6"/>
    <text x="1015" y="524" font-family="Arial, sans-serif" font-size="14" fill="#263047">Web search</text>
    <circle cx="1350" cy="518" r="8" fill="#C9894A"/>
    <rect x="989" y="560" width="184" height="56" rx="10" fill="#172034"/>
    <text x="1015" y="594" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#F4F0E8">Agents &amp; apps</text>
    <rect x="1190" y="560" width="191" height="56" rx="10" fill="#FFFDF9" stroke="#D9D2C6"/>
    <text x="1216" y="594" font-family="Arial, sans-serif" font-size="14" fill="#263047">Local mode ready</text>
  </g>

  <g fill="#C8D1DF" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">
    <text x="100" y="690">AGICY.AI</text>
    <text x="1324" y="690">SEARCH · VOICE · AGENTS</text>
  </g>
</svg>
